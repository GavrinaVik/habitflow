    <!--
      Яндекс.Метрика.
      В проде: регистрируем счётчик на metrika.yandex.ru, подставляем
      реальный ID в МЕТРИКА_ID ниже и оставляем реальный сниппет mc.yandex.ru.
      Здесь — локальная отладочная реализация, которая пишет цели в
      window.__METRIKA_HITS__ и console. Цели создаются на metrika.yandex.ru
      как «JavaScript-события» с такими же названиями:
      registration, pricing-view, payment, create-habit, habit-checkin,
      visit_duration + data-metrica="goal:...".
    -->
    <script>
      (function () {
        var METRIKA_ID = 98765432;
        window.__METRIKA_HITS__ = [];
        window.ym = function (counterId, action) {
          if (!counterId || action === "init") return;
          var label = String(arguments[2] ?? "").replace(/^goal:/, "");
          if (!label) return;
          window.__METRIKA_HITS__.push({
            at: new Date().toISOString(),
            counterId: counterId,
            goal: label,
          });
          if (window.console) console.info("[metrica] цель:", label);
        };
        // Клики по элементам data-metrica="goal:..." — цель Метрики
        document.addEventListener("click", function (event) {
          var el = event.target.closest
            ? event.target.closest("[data-metrica^='goal:']")
            : null;
          if (el) {
            window.ym(METRIKA_ID, "reachGoal", el.getAttribute("data-metrica"));
          }
        });
      })();
    </script>
